<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>

<div class="navbar">
    <div class="logo">TOURFLEX</div>
</div>

<div class="form-container">
    <h2>Create Account</h2>

    <div th:if="${error}" style="color: red; background: #fee; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #f5c2c2;">
        <p th:text="${error}" style="margin: 0;"></p>
    </div>

    <form action="/user/register" method="post" onsubmit="return validateRegister()">
        <input type="text" id="name" name="name" placeholder="Full Name" required>

        <input type="email" id="email" name="email" placeholder="Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <button class="btn">Register</button>
    </form>
</div>

<script>
    function validateRegister() {
        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();

        let namePattern = /^[A-Za-z ]+$/;
        if (!namePattern.test(name)) {
            alert("Name must contain only letters (no numbers)");
            return false;
        }

        if (!email.endsWith("@gmail.com")) {
            alert("Email must be a valid @gmail.com address");
            return false;
        }

        return true;
    }
</script>

</body>
</html>
</html>
