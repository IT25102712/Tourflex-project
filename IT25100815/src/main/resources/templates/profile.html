<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Profile - TOURFLEX</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .profile-container {
            text-align: center;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .user-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(90deg, #0d6efd, #00c6ff);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .details { margin-bottom: 25px; color: #555; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn {
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }
        .btn-edit { background-color: #0d6efd; }
        .btn-delete { background-color: #dc3545; border: none; cursor: pointer; }
        .btn-logout { background-color: #6c757d; }
    </style>
</head>
<body>

<div class="profile-container">
    <div class="user-icon" th:text="${#strings.substring(session.user.name, 0, 1)}">U</div>

    <h2 th:text="${session.user.name}">User Name</h2>

    <div class="details">
        <p th:text="${session.user.email}">user@example.com</p>
    </div>

    <div class="btn-group">
        <a th:href="@{/user/edit/{id}(id=${session.user.id})}" class="btn btn-edit">Edit Profile</a>

        <a th:href="@{/user/delete/{id}(id=${session.user.id})}"
           class="btn btn-delete"
           onclick="return confirm('Are you sure you want to delete your account? This action cannot be undone.')">
            Delete Account
        </a>

        <a th:href="@{/user/logout}" class="btn btn-logout">Logout</a>
    </div>
</div>

</body>
</html>
