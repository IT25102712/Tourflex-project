<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Profile - TOURFLEX</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="form-container">
    <h2>Edit Your Profile</h2>

    <form th:action="@{/user/update}" th:object="${user}" method="post">

        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" th:field="*{name}" required />
        </div>

        <div class="form-group">
            <label>Email (Cannot be changed):</label>
            <input type="email" th:field="*{email}" readonly style="background-color: #f0f0f0;" />
        </div>

        <div class="form-group">
            <label>New Password:</label>
            <input type="password" th:field="*{password}" required />
        </div>

        <button type="submit" class="btn-save">Update Profile</button>

        <div style="margin-top: 15px; text-align: center;">
        <a th:href="@{/user/profile}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
